name: build

on:
  workflow_dispatch:
  push:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Android project
        run: |
          S=$(find . -name settings.gradle.kts -not -path "*/build/*" -not -path "./.git/*" | head -n 1)
          if [ -z "$S" ]; then echo "settings.gradle.kts not found"; exit 1; fi
          PDIR=$(dirname "$S")
          echo "project dir: $PDIR"
          echo "PDIR=$PDIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: |
          cd "$PDIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vyron-debug-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
