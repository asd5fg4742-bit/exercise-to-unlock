name: build

on:
  workflow_dispatch:
  push:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project zip
        run: |
          Z=$(find . -name "*.zip" -not -path "./.git/*" | head -n 1)
          if [ -z "$Z" ]; then echo "no zip found in repo"; exit 1; fi
          echo "zip: $Z"
          mkdir -p proj
          unzip -q "$Z" -d proj
          S=$(find proj -name settings.gradle.kts -not -path "*/build/*" | head -n 1)
          if [ -z "$S" ]; then echo "settings.gradle.kts not found inside zip"; exit 1; fi
          PDIR=$(dirname "$S")
          echo "project dir: $PDIR"
          echo "PDIR=$PDIR" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        run: |
          SDKM=$(find "$ANDROID_HOME" -path "*cmdline-tools*" -name sdkmanager -type f | head -n 1)
          if [ -z "$SDKM" ]; then echo "sdkmanager not found in $ANDROID_HOME"; exit 1; fi
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: |
          cd "$PDIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vyron-debug-apk
          path: proj/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
