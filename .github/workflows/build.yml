name: build
on:
  workflow_dispatch:
  push:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: find newest zip
        run: |
          Z=$(git log --name-only --format= -- '*.zip' | grep -m1 '\.zip$')
          echo "zip: $Z"
          mkdir proj
          unzip -q "$Z" -d proj
          S=$(find proj -name settings.gradle.kts | head -1)
          echo "PDIR=$(dirname "$S")" >> "$GITHUB_ENV"
      - name: fix
        run: |
          cd "$PDIR"
          grep -q jvmToolchain app/build.gradle.kts || printf '\nkotlin {\n    jvmToolchain(21)\n}\n' >> app/build.gradle.kts
          sed -i 's/onSmartLock = { startActivity(Intent(this, SquatCameraActivity::class.java)) }/onSmartLock = { context.startActivity(Intent(context, SquatCameraActivity::class.java)) }/' app/src/main/java/com/vyron/app/MainActivity.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
      - name: build
        run: |
          cd "$PDIR"
          gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: proj/**/app/build/outputs/apk/debug/*.apk
