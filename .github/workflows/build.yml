name: build
on:
  workflow_dispatch:
  push:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q VYRON_starter.zip
      - name: fix
        working-directory: VYRON
        run: printf '\nkotlin {\n    jvmToolchain(21)\n}\n' >> app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
      - run: gradle assembleDebug --stacktrace
        working-directory: VYRON
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: VYRON/app/build/outputs/apk/debug/*.apk
