name: build
on:
  workflow_dispatch:
  push:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q ProjectAmirali-source.zip
      - name: fix
        working-directory: ProjectAmirali
        run: |
          cat > app/src/main/res/xml/app_guard_service.xml <<'EOF'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowsChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="250"
              android:canRetrieveWindowContent="false"
              android:description="@string/guard_desc" />
          EOF
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="guard_desc">برای تشخیص باز شدن برنامه‌های انتخاب‌شده و نمایش صفحه قفل تمرین استفاده می‌شود. اطلاعات صفحه خوانده نمی‌شود.</string>
          </resources>
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          kotlin {
              jvmToolchain(21)
          }
          android {
              namespace = "com.amirali.project"
              compileSdk = 36
              defaultConfig {
                  applicationId = "com.amirali.project"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "0.1.0"
              }
          }
          EOF
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
      - run: gradle assembleDebug --stacktrace
        working-directory: ProjectAmirali
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ProjectAmirali/app/build/outputs/apk/debug/*.apk
