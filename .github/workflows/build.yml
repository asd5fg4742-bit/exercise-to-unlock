name: build
on:
  workflow_dispatch:
  push:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q ProjectAmirali-source.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
      - run: gradle assembleDebug --stacktrace
        working-directory: ProjectAmirali
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ProjectAmirali/app/build/outputs/apk/debug/*.apk
